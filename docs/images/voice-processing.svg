<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Example voice-processing flow</title>
  <desc id="desc">The Android app sends microphone audio through LiveKit to a PC-side agent. The agent uses kotoba-whisper for speech recognition, an LLM to create a reply, and VOICEVOX for speech synthesis, then sends reply audio back through LiveKit.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#4263eb"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#7950f2"/>
    </marker>
  </defs>
  <rect width="1200" height="470" rx="24" fill="#f6f8fc"/>
  <text x="40" y="52" fill="#172b4d" font-family="Arial, sans-serif" font-size="26" font-weight="700">EXAMPLE VOICE PROCESSING FLOW</text>
  <text x="40" y="80" fill="#52627a" font-family="Arial, sans-serif" font-size="16">PC-side example · providers and pipeline depend on the agent configuration</text>

  <rect x="35" y="150" width="205" height="180" rx="18" fill="#fff" stroke="#b8c5d6" stroke-width="2"/>
  <circle cx="137" cy="197" r="25" fill="#e7edff"/>
  <path d="M137 182v25m-10-12a10 10 0 0 0 20 0m-10 10v8m-9 0h18" fill="none" stroke="#4263eb" stroke-width="3" stroke-linecap="round"/>
  <text x="137" y="250" text-anchor="middle" fill="#172b4d" font-family="Arial, sans-serif" font-size="19" font-weight="700">Android app</text>
  <text x="137" y="278" text-anchor="middle" fill="#52627a" font-family="Arial, sans-serif" font-size="15">ProtoOverlay</text>
  <text x="137" y="303" text-anchor="middle" fill="#52627a" font-family="Arial, sans-serif" font-size="14">microphone / speaker</text>

  <rect x="330" y="168" width="205" height="145" rx="18" fill="#fff" stroke="#b8c5d6" stroke-width="2"/>
  <rect x="354" y="190" width="34" height="30" rx="6" fill="#e7edff"/>
  <circle cx="365" cy="205" r="4" fill="#4263eb"/>
  <circle cx="377" cy="205" r="4" fill="#4263eb"/>
  <text x="432" y="211" fill="#172b4d" font-family="Arial, sans-serif" font-size="20" font-weight="700">LiveKit</text>
  <text x="432" y="238" fill="#52627a" font-family="Arial, sans-serif" font-size="14">real-time transport</text>
  <text x="432" y="261" fill="#52627a" font-family="Arial, sans-serif" font-size="14">audio / video / data</text>
  <text x="432" y="285" fill="#52627a" font-family="Arial, sans-serif" font-size="13">not the STT or TTS itself</text>

  <rect x="625" y="105" width="540" height="280" rx="20" fill="#fff" stroke="#8da2c0" stroke-width="2"/>
  <text x="650" y="140" fill="#172b4d" font-family="Arial, sans-serif" font-size="19" font-weight="700">PC-side agent (not included in this Android repository)</text>

  <rect x="650" y="178" width="145" height="140" rx="14" fill="#eef4ff" stroke="#b8c5d6"/>
  <text x="722" y="213" text-anchor="middle" fill="#172b4d" font-family="Arial, sans-serif" font-size="16" font-weight="700">kotoba-whisper</text>
  <text x="722" y="243" text-anchor="middle" fill="#4263eb" font-family="Arial, sans-serif" font-size="14" font-weight="700">STT</text>
  <text x="722" y="269" text-anchor="middle" fill="#52627a" font-family="Arial, sans-serif" font-size="13">speech to text</text>
  <text x="722" y="291" text-anchor="middle" fill="#52627a" font-family="Arial, sans-serif" font-size="12">recognition</text>

  <path d="M800 248h25" stroke="#8da2c0" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <rect x="835" y="178" width="130" height="140" rx="14" fill="#f2f0ff" stroke="#b8c5d6"/>
  <text x="900" y="224" text-anchor="middle" fill="#172b4d" font-family="Arial, sans-serif" font-size="17" font-weight="700">LLM / agent</text>
  <text x="900" y="254" text-anchor="middle" fill="#7950f2" font-family="Arial, sans-serif" font-size="14" font-weight="700">reply generation</text>
  <text x="900" y="282" text-anchor="middle" fill="#52627a" font-family="Arial, sans-serif" font-size="13">varies by setup</text>

  <path d="M970 248h25" stroke="#8da2c0" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <rect x="1005" y="178" width="135" height="140" rx="14" fill="#fff4e6" stroke="#d7c3a2"/>
  <text x="1072" y="224" text-anchor="middle" fill="#172b4d" font-family="Arial, sans-serif" font-size="17" font-weight="700">VOICEVOX</text>
  <text x="1072" y="254" text-anchor="middle" fill="#b85c00" font-family="Arial, sans-serif" font-size="14" font-weight="700">TTS</text>
  <text x="1072" y="282" text-anchor="middle" fill="#52627a" font-family="Arial, sans-serif" font-size="13">text to speech</text>

  <path d="M240 213h78" fill="none" stroke="#4263eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M535 213h78" fill="none" stroke="#4263eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="279" y="198" text-anchor="middle" fill="#4263eb" font-family="Arial, sans-serif" font-size="12">input audio</text>
  <text x="574" y="198" text-anchor="middle" fill="#4263eb" font-family="Arial, sans-serif" font-size="12">to agent</text>

  <path d="M625 287h-78" fill="none" stroke="#7950f2" stroke-width="3" marker-end="url(#arrow-purple)"/>
  <path d="M330 287h-78" fill="none" stroke="#7950f2" stroke-width="3" marker-end="url(#arrow-purple)"/>
  <text x="586" y="310" text-anchor="middle" fill="#7950f2" font-family="Arial, sans-serif" font-size="12">reply audio</text>
  <text x="291" y="310" text-anchor="middle" fill="#7950f2" font-family="Arial, sans-serif" font-size="12">to phone</text>

  <text x="40" y="430" fill="#52627a" font-family="Arial, sans-serif" font-size="14">This illustrates one PC-side setup; the app does not bundle or select these speech services.</text>
</svg>
